<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning DOM</title>
</head>
<body style="background-color: lightskyblue; color:blue">
    <ul class="language">
        <li>JavaScript</li>
    </ul>
</body>
<script>
    function addLanguage(langName){
        const li = document.createElement('li');
        li.innerHTML = `${langName}`
        document.querySelector('.language').appendChild(li)

    }
    addLanguage("Java")
    addLanguage("C++")
    addLanguage("Python")
    function addOptiLanguage(langName){
       const li = document.createElement('li');
       const addText =
       li.appendChild(document.createTextNode(langName))
       document.querySelector('.language').appendChild(li)
    }
    addOptiLanguage('SQL')

//Edit. ///editing make things easy to replace with
const thirdLang = document.querySelector("li:nth-child(3)")
//console.log(thirdLang);
//thirdLang.innerHTML = "Ruby"
const newli = document.createElement('li')
newli.textContent = "Ruby"
thirdLang.replaceWith(newli)


//edit
const secondLang = document.querySelector("li:nth-child(2)")
secondLang.outerHTML = '<li>Java</li>'


//Remove 
const lastLang = document.querySelector('li:last-child')
lastLang.remove()
</script>
</html>
