<script>


/// Event propagation
//capturing event.. happens from outward to inward
//bubbling event... happnes from inner to outward
// the default values are false.. so its okay if we do not write the thirrd argument False.
///sometimes we do not want event propagation in a sense that it passes to other functions so inner and outer function behave separately. so there we use stopPropagation().
//event.stopPropagation() is used to stop an event from moving through the DOM tree.
//In other words, it prevents the event from going:
//up (bubbling phase)
//or down (capturing phase, if used carefully)

    //event.preventDefault() is used when we want to stop the browser's default behavior for an event.

    document.querySelector('#Floral visuals').addEventListener('click', function(e){
        console.log(e.target.tagName);
        if (e.target.tagName === 'IMG') {
            console.log(e.target.id);
            let removeIt = e.target.parentNode
            removeIt.remove()
        }
    })
