<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic File</title>
</head>
<body>
    <button>Button clicked</button>
</body>
<script>
    class React {
        constructor(){
            this.library = "React"
            this.server = "https://localhost:3000"
            // requirements
            // reference of the button
            // when click something get clicked in the console


            document
            .querySelector('button')
            .addEventListener('click', this.handleClick.bind(this))
        }

        // Here he have used the keyword bind, in JavaScript, bind() is a method that creates a new function with a specific value of this permanently attached to it.
        handleClick(){
            console.log("button clicked");
            console.log(this.server);
        }

    }

    const app = new React()
</script>
</html>
